   services:
     - type: web
       name: kaggriculture-api
       runtime: python
       plan: free
       buildCommand: pip install -r requirements.txt
       startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
       envVars:
         - key: ALLOWED_ORIGINS
           value: https://aritrabasu247.github.io
         - key: PYTHON_VERSION
           value: 3.11.9
